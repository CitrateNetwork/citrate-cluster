\* PBA-L6b-005 — exhaustive check of the on-wire authorization set. Run:
\*   java -jar tla2tools.jar -config ClusterWireAdmission.cfg ClusterWireAdmission.tla
\* Setting RevokeDeauthorizes = FALSE (the pre-fix SetRoster) makes TLC report the L6b-005 trace.
SPECIFICATION Spec
CONSTANTS Peers = {p1, p2, p3}
          RevokeDeauthorizes = TRUE
INVARIANT TypeOK
INVARIANT AuthorizedIsAllowed
INVARIANT WireSubsetAllowed

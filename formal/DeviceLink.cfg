\* HUP-S8.1: exhaustive check of the DeviceLink admission invariants.
\* Two members, three devices (one member can own two machines), three keys (every device can
\* mint one; key reuse would be a fourth device on an existing key, which MintKey forbids).
\* Run:  java -cp tla2tools.jar tlc2.TLC -config DeviceLink.cfg DeviceLink.tla
\* ADR-003 review (2026-10-04): 21,456 distinct states, no error. Mutants that must each fail (see
\* the ADR): admit any allowed comms identity, no eviction on IssueLink, gate ignores revokedBy,
\* Revoke not recorded in revokedBy, Reconcile keeps legacy, DropLink keeps the device meshed.
SPECIFICATION Spec
CONSTANTS
    Members = {m1, m2}
    Devices = {d1, d2, d3}
    Keys = {k1, k2, k3}
    NoKey = NoKey
INVARIANTS
    TypeOK
    NoActWithoutLink
    RevokedDeviceEvicted
    DistinctPeerIds
    OneMemberPerDevice
    AdmittedSubsetAllowed
    LegacyOnlyWithoutDevices
    RevokedMachineNotBackAsMember
    LegacySubsetAllowed

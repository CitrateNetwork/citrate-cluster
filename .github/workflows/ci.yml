# created: 2026-08-28 | branch: main | author: Claude Opus 4.8, directed by @SaulBuilds | status: active
# Honest CI for citrate-cluster: fmt + clippy (-D warnings) + workspace test + release build.
# No private federation crate deps (cluster-core/daemon are self-contained), so no cross-repo token.
name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      - name: build release
        run: cargo build --release -p cluster-daemon

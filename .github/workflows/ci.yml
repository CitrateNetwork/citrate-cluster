# created: 2026-08-28 | branch: main | author: Claude Opus 4.8, directed by @SaulBuilds | status: active
# Honest CI for citrate-cluster: fmt + clippy (-D warnings) + workspace test + release build.
# No private federation crate deps (cluster-core/daemon are self-contained), so no cross-repo token.
name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Rust 1.96.0: the toolchain citrate-core builds the shipped cluster-daemon with
      # (citrate-core release/components.json toolchain.rust). Not `stable`: Rust 1.100 (2026-11-09)
      # made Infallible an alias of `!`, and libp2p-swarm-derive 0.35.1's NetworkBehaviour expansion
      # then trips unreachable_code ("unreachable call") on behaviours whose handler event is
      # Infallible (connection_limits, allow_block_list). Upstream allows it inside the macro
      # (rust-libp2p swarm-derive, unreleased after 0.36.0); move to stable once that ships.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      # HUP-S8.4: the opt-in mDNS build (off in release builds) must stay clippy-clean and green.
      - name: clippy + test (mdns feature)
        run: |
          cargo clippy -p cluster-daemon --features mdns --all-targets --locked -- -D warnings
          cargo test -p cluster-daemon --features mdns --locked
      - name: build release
        run: cargo build --release -p cluster-daemon

  # The Windows IPC transport (a named pipe whose per-install name must match citrate-core's client,
  # PBA-L7b-004) only compiles and runs on Windows: build the daemon and run its tests there.
  windows:
    name: rust (windows, cluster-daemon test)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Rust 1.96.0: the toolchain citrate-core builds the shipped cluster-daemon with
      # (citrate-core release/components.json toolchain.rust). Not `stable`: Rust 1.100 (2026-11-09)
      # made Infallible an alias of `!`, and libp2p-swarm-derive 0.35.1's NetworkBehaviour expansion
      # then trips unreachable_code ("unreachable call") on behaviours whose handler event is
      # Infallible (connection_limits, allow_block_list). Upstream allows it inside the macro
      # (rust-libp2p swarm-derive, unreleased after 0.36.0); move to stable once that ships.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.96.0"
          components: clippy
      - name: clippy
        run: cargo clippy -p cluster-daemon --all-targets --locked -- -D warnings
      - name: test
        run: cargo test -p cluster-daemon --locked

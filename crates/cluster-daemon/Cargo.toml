[package]
name = "cluster-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "citrate-cluster daemon — a group's private P2P mesh (libp2p Noise + gossipsub) driven by the cluster-core admission gate, exposing a loopback UDS JSON IPC so a lean client (citrate-core) joins/reconciles/publishes without linking the networking tree."

[[bin]]
name = "cluster-daemon"
path = "src/main.rs"

[dependencies]
cluster-core = { path = "../cluster-core" }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
# Constant-time bearer comparison on the loopback IPC token (no `==` on the secret).
subtle = "2"
# CL-S1: the real cross-machine mesh (Noise + gossipsub). These live in the daemon ONLY;
# cluster-core must never link libp2p/tokio (CLAUDE.md rule 3 — verified in CI-equivalent grep).
libp2p = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
sha3 = { workspace = true }
# CL-B-001: zeroize the cluster identity secret + its hex/byte intermediates on drop.
zeroize = { workspace = true }
# CL-B-006/CL-B-007: umask the control socket at bind time, peer-uid check (getpeereid), and stat the
# 0600 seed/bearer files before reading them. Already in the tree via tokio/libp2p; declared directly.
libc = "0.2"
